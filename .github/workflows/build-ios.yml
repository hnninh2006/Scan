# Đặt file này tại: .github/workflows/build-ios.yml
name: Build iOS (Flet)

on:
  workflow_dispatch:   # Bấm chạy thủ công trong tab Actions
  push:                # Tự chạy khi đẩy code lên nhánh main
    branches: [ "main" ]
    tags: ["v*"]

env:
  PYTHON_VERSION: "3.12"
  # PHẢI khớp với phiên bản flet trong requirements.txt / pyproject.toml
  FLET_VERSION: "0.27.6"

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Flet CLI
        run: |
          python -m pip install --upgrade pip
          pip install "flet-cli==${{ env.FLET_VERSION }}" "flet==${{ env.FLET_VERSION }}"

      # --- Ký app (tùy chọn). Bỏ qua nếu chưa có secrets -> chỉ ra .xcarchive ---
      - name: Import signing certificate and profile
        if: ${{ env.P12_BASE64 != '' }}
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db
          security create-keychain -p "tmp" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "tmp" "$KEYCHAIN"
          echo "$P12_BASE64" \vert{} base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "tmp" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision

      - name: Build IPA
        env:
          IOS_PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
          IOS_CERT_NAME: ${{ secrets.IOS_CERT_NAME }}
        run: |
          set -o pipefail
          ARGS=""
          if [ -n "$IOS_PROFILE_NAME" ] && [ -n "$IOS_CERT_NAME" ]; then
            ARGS="--ios-provisioning-profile \"$IOS_PROFILE_NAME\" --ios-signing-certificate \"$IOS_CERT_NAME\" --ios-export-method release-testing"
          fi
          echo "y" | eval flet build ipa -v $ARGS 2>&1 | tee
