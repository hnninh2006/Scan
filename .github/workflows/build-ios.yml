[project]
name = "land-scanner-app"
version = "1.0.0"
description = "Phan mem Scan Ho so Dat dai va Xuat PDF"
dependencies = [
    "flet==0.27.6",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0"
]

[tool.flet]
org = "vn.landscanner"
product = "Scan Ho So Dat Dai"
company = "Land Cadastral Tools"

[tool.flet.android.permission]
"android.permission.CAMERA" = true
"android.permission.READ_EXTERNAL_STORAGE" = true
"android.permission.WRITE_EXTERNAL_STORAGE" = true

[tool.flet.ios.info]
NSCameraUsageDescription = "Ung dung can quyen truy cap Camera de chup ho so dat dai."
NSPhotoLibraryUsageDescription = "Ung dung can quyen truy cap thu vien anh de luu va xuat PDF."
