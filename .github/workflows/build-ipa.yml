name: Build iOS IPA
on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          run: pip install flet --upgrade
      - name: Install Flet
        run: pip install flet==0.27.6
      - name: Build IPA
        run: flet build ipa
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: build/ipa/*.ipa
