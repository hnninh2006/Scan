<script>
const $=s=>document.querySelector(s),mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const ISO_RATIO=Math.SQRT2; // Tỷ lệ chuẩn giấy A4 / A3: √2 ≈ 1.41421356
const MAXL=2000,toast=m=>{const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)};
let S={ma:'26784',to:'',thua:'',pages:[]},raw=null,proc=null,rot=0,retake=null,urls=[],pdf=null;
let curQuad=null,isAutoQuad=false,editingQuad=false,dragIdx=-1,liveStream=null;

// ---- 1. LƯU TRỮ BỀN VỮNG (IndexedDB)
const db=new Promise((ok,no)=>{const r=indexedDB.open('landscan',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const kv=async(mode,fn)=>{const d=await db;return new Promise((ok,no)=>{const t=d.transaction('kv',mode),q=fn(t.objectStore('kv'));t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>no(t.error)})};
const save=()=>kv('readwrite',s=>s.put(S,'s')).catch(()=>toast('Không lưu được dữ liệu cục bộ'));

// ---- 2. TOÁN HỌC HÌNH HỌC PHỐI CẢNH A4/A3 & XỬ LÝ ẢNH CƠ SỞ
const copy=c=>{const o=mk(c.width,c.height);o.getContext('2d').drawImage(c,0,0);return o};
const rot90=c=>{const o=mk(c.height,c.width),x=o.getContext('2d');x.translate(o.width,0);x.rotate(Math.PI/2);x.drawImage(c,0,0);return o};
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);

function blur(a,w,h,r){
  if(r<1)return new Float32Array(a);
  const t=new Float32Array(a.length),o=new Float32Array(a.length);
  for(let y=0;y<h;y++){let s=0,n=0;const b=y*w;for(let x=0;x<=r&&x<w;x++){s+=a[b+x];n++}
    for(let x=0;x<w;x++){t[b+x]=s/n;const ad=x+r+1,rm=x-r;if(ad<w){s+=a[b+ad];n++}if(rm>=0){s-=a[b+rm];n--}}}
  for(let x=0;x<w;x++){let s=0,n=0;for(let y=0;y<=r&&y<h;y++){s+=t[y*w+x];n++}
    for(let y=0;y<h;y++){o[y*w+x]=s/n;const ad=y+r+1,rm=y-r;if(ad<h){s+=t[ad*w+x];n++}if(rm>=0){s-=t[rm*w+x];n--}}}
  return o;
}

function morphOp(a,w,h,r,isMax){
  const t=new Float32Array(w*h),o=new Float32Array(w*h);
  for(let y=0;y<h;y++){const b=y*w;for(let x=0;x<w;x++){
    let v=isMax?-1e9:1e9;const x0=Math.max(0,x-r),x1=Math.min(w-1,x+r);
    for(let k=x0;k<=x1;k++){const u=a[b+k];if(isMax?u>v:u<v)v=u}t[b+x]=v;
  }}
  for(let x=0;x<w;x++){for(let y=0;y<h;y++){
    let v=isMax?-1e9:1e9;const y0=Math.max(0,y-r),y1=Math.min(h-1,y+r);
    for(let k=y0;k<=y1;k++){const u=t[k*w+x];if(isMax?u>v:u<v)v=u}o[y*w+x]=v;
  }}
  return o;
}
const morphClose=(a,w,h,r)=>morphOp(morphOp(a,w,h,r,true),w,h,r,false);

function otsu(g){
  const h=new Int32Array(256);let T=g.length,sa=0;
  for(let i=0;i<T;i++){const v=Math.max(0,Math.min(255,g[i]|0));h[v]++}
  for(let i=0;i<256;i++)sa+=i*h[i];
  let wb=0,sb=0,best=-1,t=127;
  for(let i=0;i<256;i++){wb+=h[i];if(!wb)continue;const wf=T-wb;if(!wf)break;sb+=i*h[i];const d=sb/wb-(sa-sb)/wf,v=wb*wf*d*d;if(v>best){best=v;t=i}}
  return t;
}

function orderQuad(Q){
  let cx=0,cy=0;for(const p of Q){cx+=p[0];cy+=p[1]}cx/=4;cy/=4;
  const C=Q.slice().sort((a,b)=>Math.atan2(a[1]-cy,a[0]-cx)-Math.atan2(b[1]-cy,b[0]-cx));
  let tl=0,best=1e9;
  for(let i=0;i<4;i++){const s=C[i][0]*0.9+C[i][1]*1.1;if(s<best){best=s;tl=i}}
  return[C[tl],C[(tl+1)%4],C[(tl+2)%4],C[(tl+3)%4]];
}

// ĐÃ SỬA DẤU TÍCH CÓ HƯỚNG: Tính chính xác tỷ lệ 3D thực tế của tờ giấy A4/A3 (k1=k2=k3=1 trên hình chữ nhật phẳng)
function calc3DAspectRatio(Q,w,h){
  const cx=w*0.5,cy=h*0.5,f=Math.max(w,h)*0.95;
  const m=Q.map(p=>[p[0]-cx,p[1]-cy,1]);
  const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
  const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
  const c13=cross(m[1],m[3]),c12=cross(m[1],m[2]),c32=cross(m[3],m[2]);
  const den2=dot(c13,m[2]),den3=dot(c12,m[3]),den1=dot(c32,m[1]);
  const wAvg=0.5*(dist(Q[0],Q[1])+dist(Q[3],Q[2])),hAvg=0.5*(dist(Q[0],Q[3])+dist(Q[1],Q[2]));
  const ratio2D=Math.max(wAvg,hAvg)/Math.max(1e-4,Math.min(wAvg,hAvg));
  if(Math.abs(den2)<1e-5||Math.abs(den3)<1e-5||Math.abs(den1)<1e-5)return{ratio:ratio2D,kOk:false,portrait:hAvg>=wAvg};
  const k2=-dot(c13,m[0])/den2;
  const k3=dot(c12,m[0])/den3;
  const k1=dot(c32,m[0])/den1;
  if(k1<0.45||k1>2.25||k2<0.45||k2>2.25||k3<0.45||k3>2.25)return{ratio:ratio2D,kOk:false,portrait:hAvg>=wAvg};
  let f2=f*f;
  const num=(k1*m[1][0]-m[0][0])*(k3*m[3][0]-m[0][0])+(k1*m[1][1]-m[0][1])*(k3*m[3][1]-m[0][1]);
  const den=(k1-1)*(k3-1);
  if(Math.abs(den)>1e-3){
    const est=-num/den;
    if(est>0.35*f*f&&est<2.5*f*f)f2=est;
  }
  const W3=Math.sqrt(((k1*m[1][0]-m[0][0])**2+(k1*m[1][1]-m[0][1])**2)/f2+(k1-1)**2);
  const H3=Math.sqrt(((k3*m[3][0]-m[0][0])**2+(k3*m[3][1]-m[0][1])**2)/f2+(k3-1)**2);
  const r3=Math.max(W3,H3)/Math.max(1e-5,Math.min(W3,H3));
  return{ratio:0.65*r3+0.35*ratio2D,kOk:true,portrait:H3>=W3};
}

function fitRobustLine(pts){
  if(!pts||pts.length<4)return null;
  const n=pts.length,w=new Float32Array(n);
  for(let i=0;i<n;i++)w[i]=pts[i][2]||1;
  let vx=1,vy=0,mx=0,my=0;
  for(let it=0;it<5;it++){
    let sw=0,sx=0,sy=0;
    for(let i=0;i<n;i++){const wi=w[i];sw+=wi;sx+=wi*pts[i][0];sy+=wi*pts[i][1]}
    if(sw<1e-5)return null;
    mx=sx/sw;my=sy/sw;
    let sxx=0,syy=0,sxy=0;
    for(let i=0;i<n;i++){const wi=w[i],dx=pts[i][0]-mx,dy=pts[i][1]-my;sxx+=wi*dx*dx;syy+=wi*dy*dy;sxy+=wi*dx*dy}
    const tr=sxx+syy,det=sxx*syy-sxy*sxy,lam=0.5*(tr+Math.sqrt(Math.max(0,tr*tr-4*det)));
    vx=sxy;vy=lam-sxx;
    const len=Math.hypot(vx,vy);
    if(len<1e-6){vx=Math.abs(sxx)>=Math.abs(syy)?1:0;vy=1-vx}else{vx/=len;vy/=len}
    const nx=-vy,ny=vx;
    for(let i=0;i<n;i++){
      const r=Math.abs((pts[i][0]-mx)*nx+(pts[i][1]-my)*ny);
      const base=pts[i][2]||1;
      w[i]=r<1.8?base:r<4.5?base*(1-(r/4.5)**2)**2:base*0.01;
    }
  }
  const a=-vy,b=vx,c=-(a*mx+b*my);
  return[a,b,c];
}

function intersectLines(L1,L2,fallback){
  if(!L1||!L2)return fallback;
  const det=L1[0]*L2[1]-L2[0]*L1[1];
  if(Math.abs(det)<1e-4)return fallback;
  const x=(L1[1]*L2[2]-L2[1]*L1[2])/det,y=(L2[0]*L1[2]-L1[0]*L2[2])/det;
  return(!fallback||dist([x,y],fallback)<95)?[x,y]:fallback;
}

// ---- 3. LÕI PHÁT HIỆN GIẤY A4/A3 DỌC (CHỐNG BẮT NHẦM BẢNG BIỂU + KHÔI PHỤC CẠNH THỨ 4 THEO √2)
function cleanMask(mask,w,h){
  const vis=new Int32Array(w*h),q=new Int32Array(w*h);
  let bestId=0,bestScore=-1,id=0;
  const cx=w*0.5,cy=h*0.5,maxD=Math.hypot(cx,cy);
  for(let i=0;i<w*h;i++){
    if(!mask[i]||vis[i])continue;
    id++;let head=0,tail=0,sx=0,sy=0,centerHits=0;
    q[tail++]=i;vis[i]=id;
    while(head<tail){
      const cur=q[head++],x=cur%w,y=(cur/w)|0;
      sx+=x;sy+=y;
      if(x>w*0.22&&x<w*0.78&&y>h*0.22&&y<h*0.78)centerHits++;
      if(x>0&&mask[cur-1]&&!vis[cur-1]){vis[cur-1]=id;q[tail++]=cur-1}
      if(x<w-1&&mask[cur+1]&&!vis[cur+1]){vis[cur+1]=id;q[tail++]=cur+1}
      if(y>0&&mask[cur-w]&&!vis[cur-w]){vis[cur-w]=id;q[tail++]=cur-w}
      if(y<h-1&&mask[cur+w]&&!vis[cur+w]){vis[cur+w]=id;q[tail++]=cur+w}
    }
    const area=tail;if(area<w*h*0.07)continue;
    const mx=sx/area,my=sy/area,centW=1-0.4*(Math.hypot(mx-cx,my-cy)/maxD);
    const sc=area*centW*(1+centerHits/(w*h*0.25));
    if(sc>bestScore){bestScore=sc;bestId=id}
  }
  const out=new Uint8Array(w*h);
  if(!bestId)return{mask:out,area:0};
  for(let i=0;i<w*h;i++)if(vis[i]===bestId)out[i]=1;

  const bg=new Uint8Array(w*h);let head=0,tail=0;
  const pushBg=idx=>{if(!out[idx]&&!bg[idx]){bg[idx]=1;q[tail++]=idx}};
  for(let x=0;x<w;x++){pushBg(x);pushBg((h-1)*w+x)}
  for(let y=0;y<h;y++){pushBg(y*w);pushBg(y*w+w-1)}
  while(head<tail){
    const cur=q[head++],x=cur%w,y=(cur/w)|0;
    if(x>0)pushBg(cur-1);if(x<w-1)pushBg(cur+1);
    if(y>0)pushBg(cur-w);if(y<h-1)pushBg(cur+w);
  }
  let area=0;
  for(let i=0;i<w*h;i++){if(!bg[i]){out[i]=1;area++}}
  return{mask:out,area};
}

function convexHull(pts){
  if(pts.length<=3)return pts.slice();
  const P=pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cross=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  const lo=[],up=[];
  for(const p of P){while(lo.length>=2&&cross(lo[lo.length-2],lo[lo.length-1],p)<=0)lo.pop();lo.push(p)}
  for(let i=P.length-1;i>=0;i--){const p=P[i];while(up.length>=2&&cross(up[up.length-2],up[up.length-1],p)<=0)up.pop();up.push(p)}
  lo.pop();up.pop();return lo.concat(up);
}

function hullToQuads(H){
  const n=H.length;if(n<4)return[];
  const out=[];
  let cx=0,cy=0;for(const p of H){cx+=p[0];cy+=p[1]}cx/=n;cy/=n;

  const hist=new Float32Array(90);
  for(let i=0;i<n;i++){
    const a=H[i],b=H[(i+1)%n],dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy);
    if(l<2)continue;
    let deg=Math.round((Math.atan2(dy,dx)*180/Math.PI)%90);
    if(deg<0)deg+=90;
    for(let d=-3;d<=3;d++)hist[(deg+d+90)%90]+=l*(4-Math.abs(d));
  }
  let bestDeg=0,bestW=-1;
  for(let d=0;d<90;d++)if(hist[d]>bestW){bestW=hist[d];bestDeg=d}
  const th=(bestDeg>45?bestDeg-90:bestDeg)*Math.PI/180;
  const ux=Math.cos(th),uy=Math.sin(th),vx=-uy,vy=ux;

  const sides=[[],[],[],[]];
  for(let i=0;i<n;i++){
    const a=H[i],b=H[(i+1)%n],dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy);
    if(l<1.5)continue;
    const nx=dy/l,ny=-dx/l;
    const nu=nx*ux+ny*uy,nv=nx*vx+ny*vy;
    const mx=0.5*(a[0]+b[0])-cx,my=0.5*(a[1]+b[1])-cy;
    const mu=mx*ux+my*uy,mv=mx*vx+my*vy;
    let bucket=-1;
    if(Math.abs(nv)>=Math.abs(nu)){
      if(nv<0&&mv<0)bucket=0;
      else if(nv>0&&mv>0)bucket=2;
    }else{
      if(nu>0&&mu>0)bucket=1;
      else if(nu<0&&mu<0)bucket=3;
    }
    if(bucket>=0){
      const steps=Math.max(2,Math.round(l/3));
      for(let s=0;s<=steps;s++){
        const t=s/steps;
        sides[bucket].push([a[0]+dx*t,a[1]+dy*t,l]);
      }
    }
  }
  if(sides.every(s=>s.length>=4)){
    const L=sides.map(s=>fitRobustLine(s));
    if(L.every(Boolean)){
      const Q=[
        intersectLines(L[3],L[0],null),
        intersectLines(L[0],L[1],null),
        intersectLines(L[1],L[2],null),
        intersectLines(L[2],L[3],null)
      ];
      if(Q.every(Boolean))out.push(orderQuad(Q));
    }
  }

  let i0=0,d0=-1;for(let i=0;i<n;i++){const d=Math.hypot(H[i][0]-cx,H[i][1]-cy);if(d>d0){d0=d;i0=i}}
  let i2=0,d2=-1;for(let i=0;i<n;i++){const d=dist(H[i0],H[i]);if(d>d2){d2=d;i2=i}}
  const side=(a,b,p)=>(b[0]-a[0])*(p[1]-a[1])-(b[1]-a[1])*(p[0]-a[0]);
  let i1=-1,i3=-1,b1=-1,b3=-1;
  for(let i=0;i<n;i++){
    const s=side(H[i0],H[i2],H[i]),ar=Math.abs(s);
    if(s>0&&ar>b1){b1=ar;i1=i}else if(s<0&&ar>b3){b3=ar;i3=i}
  }
  if(i1>=0&&i3>=0){
    let idx=[i0,i1,i2,i3];
    for(let it=0;it<3;it++){
      for(let k=0;k<4;k++){
        const prev=H[idx[(k+3)%4]],next=H[idx[(k+1)%4]],opp=H[idx[(k+2)%4]];
        const refSide=Math.sign(side(prev,next,opp))||1;
        let bestI=idx[k],bestA=-1;
        for(let i=0;i<n;i++){
          const sv=side(prev,next,H[i]);
          if(sv*refSide<=0){const a=Math.abs(sv);if(a>bestA){bestA=a;bestI=i}}
        }
        idx[k]=bestI;
      }
    }
    out.push(orderQuad(idx.map(i=>[H[i][0],H[i][1]])));
  }
  return out;
}

function refineQuadByEdges(Q,feat,searchRad=9){
  const{w,h,mag,gx,gy,closedL,flatL,paperL}=feat;
  const lines=[];
  for(let k=0;k<4;k++){
    const A=Q[k],B=Q[(k+1)%4],len=dist(A,B);
    if(len<16){lines.push(null);continue}
    const tx=(B[0]-A[0])/len,ty=(B[1]-A[1])/len;
    const nx=ty,ny=-tx;
    const pts=[];
    const steps=Math.min(64,Math.max(20,len|0));
    for(let s=0;s<=steps;s++){
      const t=0.14+0.72*(s/steps);
      const bx=A[0]+(B[0]-A[0])*t,by=A[1]+(B[1]-A[1])*t;
      let bestR=0,bestScore=-1e9;
      for(let r=-searchRad;r<=searchRad;r+=0.5){
        const px=Math.round(bx+nx*r),py=Math.round(by+ny*r);
        if(px<=1||py<=1||px>=w-2||py>=h-2){
          if(Math.abs(r)<1.5&&bestScore<5){bestScore=5;bestR=r}
          continue;
        }
        const idx=py*w+px,m=mag[idx];
        const align=Math.abs(gx[idx]*nx+gy[idx]*ny)/(m+1e-3);
        const ix=Math.min(w-1,Math.max(0,Math.round(px-nx*4))),iy=Math.min(h-1,Math.max(0,Math.round(py-ny*4)));
        const ox=Math.min(w-1,Math.max(0,Math.round(px+nx*4))),oy=Math.min(h-1,Math.max(0,Math.round(py+ny*4)));
        const inL=closedL[iy*w+ix],outL=closedL[oy*w+ox];
        const inFlat=flatL[iy*w+ix],outFlat=flatL[oy*w+ox];
        const stepL=(inL-outL)+0.8*(inFlat-outFlat);
        const bothPaperPenalty=(outFlat>paperL-10&&Math.abs(inFlat-outFlat)<9)?35:0;
        const sc=(m*(0.4+0.6*align)*1.6 + Math.max(-15,Math.min(55,stepL))*1.1 - bothPaperPenalty)*(1-0.028*Math.abs(r));
        if(sc>bestScore){bestScore=sc;bestR=r}
      }
      if(bestScore>3.5)pts.push([bx+nx*bestR,by+ny*bestR,Math.max(1,bestScore)]);
    }
    lines.push(fitRobustLine(pts));
  }
  return[
    intersectLines(lines[3],lines[0],Q[0]),
    intersectLines(lines[0],lines[1],Q[1]),
    intersectLines(lines[1],lines[2],Q[2]),
    intersectLines(lines[2],lines[3],Q[3])
  ];
}

function isValidA4A3Quad(Q,w,h){
  if(!Q||Q.length!==4)return false;
  const padX=w*0.12,padY=h*0.12;
  for(const[x,y]of Q)if(!Number.isFinite(x)||!Number.isFinite(y)||x<-padX||y<-padY||x>w+padX||y>h+padY)return false;
  let area2=0;
  for(let i=0;i<4;i++){
    const a=Q[i],b=Q[(i+1)%4],c=Q[(i+2)%4];
    const cross=(b[0]-a[0])*(c[1]-b[1])-(b[1]-a[1])*(c[0]-b[0]);
    if(cross<=0)return false;
    const l1=dist(a,b),l2=dist(b,c);
    if(l1<Math.min(w,h)*0.18)return false;
    const cos=((b[0]-a[0])*(c[0]-b[0])+(b[1]-a[1])*(c[1]-b[1]))/(l1*l2+1e-6);
    const ang=Math.acos(Math.max(-1,Math.min(1,-cos)))*180/Math.PI;
    if(ang<56||ang>124)return false;
    area2+=a[0]*b[1]-b[0]*a[1];
  }
  const area=Math.abs(area2)*0.5,tot=w*h;
  if(area<tot*0.10||area>tot*0.985)return false;
  const d0=dist(Q[0],Q[1]),d2=dist(Q[2],Q[3]),d1=dist(Q[1],Q[2]),d3=dist(Q[3],Q[0]);
  if(Math.max(d0,d2)/Math.min(d0,d2)>1.68||Math.max(d1,d3)/Math.min(d1,d3)>1.68)return false;
  return true;
}

function scoreSingleEdge(A,B,feat){
  const{w,h,mag,gx,gy,closedL,flatL,paperL}=feat;
  const len=dist(A,B);if(len<15)return -50;
  const nx=(B[1]-A[1])/len,ny=-(B[0]-A[0])/len;
  let edgeSum=0,stepSum=0,hits=0,cnt=0;
  const S=40;
  for(let s=4;s<S-4;s++){
    const t=s/S,x=A[0]+(B[0]-A[0])*t,y=A[1]+(B[1]-A[1])*t;
    const xi=Math.round(x),yi=Math.round(y);
    if(xi<0||yi<0||xi>=w||yi>=h)continue;
    cnt++;
    if(xi<=2||yi<=2||xi>=w-3||yi>=h-3){
      const ix=Math.min(w-1,Math.max(0,Math.round(x-nx*4))),iy=Math.min(h-1,Math.max(0,Math.round(y-ny*4)));
      if(flatL[iy*w+ix]>paperL-18){edgeSum+=12;stepSum+=10;hits++}
      continue;
    }
    let bestM=0;
    for(let r=-2;r<=2;r++){
      const px=Math.min(w-1,Math.max(0,Math.round(x+nx*r))),py=Math.min(h-1,Math.max(0,Math.round(y+ny*r)));
      const idx=py*w+px,m=mag[idx];
      const align=Math.abs(gx[idx]*nx+gy[idx]*ny)/(m+1e-3);
      const val=m*(0.35+0.65*align);
      if(val>bestM)bestM=val;
    }
    const ix=Math.min(w-1,Math.max(0,Math.round(x-nx*4))),iy=Math.min(h-1,Math.max(0,Math.round(y-ny*4)));
    const ox=Math.min(w-1,Math.max(0,Math.round(x+nx*4))),oy=Math.min(h-1,Math.max(0,Math.round(y+ny*4)));
    const inFlat=flatL[iy*w+ix],outFlat=flatL[oy*w+ox];
    const diff=(closedL[iy*w+ix]-closedL[oy*w+ox])+0.8*(inFlat-outFlat);
    const innerLinePen=(outFlat>paperL-9&&Math.abs(inFlat-outFlat)<8)?28:0;
    edgeSum+=Math.min(55,bestM);
    stepSum+=Math.max(-20,Math.min(55,diff))-innerLinePen;
    if(bestM>5.5||diff>10)hits++;
  }
  if(cnt<10)return -50;
  return (edgeSum/cnt)*1.4+(stepSum/cnt)*1.25+(hits/cnt)*28;
}

function scoreA4A3Quad(Q,feat){
  const{w,h}=feat;
  if(!isValidA4A3Quad(Q,w,h))return -1e9;
  const{ratio,kOk}=calc3DAspectRatio(Q,w,h);
  if(ratio<1.12||ratio>1.76)return -1e9;
  const relErr=Math.abs(ratio-ISO_RATIO)/ISO_RATIO;
  const isoScore=85*Math.exp(-(relErr*relErr)/(2*0.085*0.085))+(kOk?12:0);
  let eSum=0,minEdge=1e9;
  for(let k=0;k<4;k++){
    const es=scoreSingleEdge(Q[k],Q[(k+1)%4],feat);
    eSum+=es;if(es<minEdge)minEdge=es;
  }
  if(eSum<22)return -1e9;
  let area=0;for(let i=0;i<4;i++){const a=Q[i],b=Q[(i+1)%4];area+=a[0]*b[1]-b[0]*a[1]}
  area=Math.abs(area)*0.5/(w*h);
  return isoScore + eSum*0.85 + Math.max(-20,minEdge)*0.45 + Math.min(0.82,area)*36;
}

function synthesizeA4A3Candidates(Q,feat){
  const{w,h}=feat;
  if(!Q||Q.length!==4)return[];
  const out=[];
  for(let moveEdge=0;moveEdge<4;moveEdge++){
    const iA=moveEdge,iB=(moveEdge+1)%4,iC=(moveEdge+2)%4,iD=(moveEdge+3)%4;
    const baseA=Q[iD],baseB=Q[iC];
    const vAx=Q[iA][0]-baseA[0],vAy=Q[iA][1]-baseA[1];
    const vBx=Q[iB][0]-baseB[0],vBy=Q[iB][1]-baseB[1];
    const lenA=Math.hypot(vAx,vAy),lenB=Math.hypot(vBx,vBy),oppLen=dist(baseA,baseB);
    if(lenA<20||lenB<20||oppLen<20)continue;
    for(const targetScale of[ISO_RATIO,1/ISO_RATIO]){
      const idealLen=oppLen*targetScale;
      const lam0=idealLen/(0.5*(lenA+lenB));
      if(lam0<0.45||lam0>1.85)continue;
      let bestLam=lam0,bestDiff=1e9;
      for(let s=-0.12;s<=0.12;s+=0.02){
        const lam=lam0*(1+s);
        const cand=Q.slice();
        cand[iA]=[baseA[0]+vAx*lam,baseA[1]+vAy*lam];
        cand[iB]=[baseB[0]+vBx*lam,baseB[1]+vBy*lam];
        const{ratio}=calc3DAspectRatio(cand,w,h);
        const df=Math.abs(ratio-ISO_RATIO);
        if(df<bestDiff){bestDiff=df;bestLam=lam}
      }
      const synQ=Q.slice();
      synQ[iA]=[Math.max(0,Math.min(w,baseA[0]+vAx*bestLam)),Math.max(0,Math.min(h,baseA[1]+vAy*bestLam))];
      synQ[iB]=[Math.max(0,Math.min(w,baseB[0]+vBx*bestLam)),Math.max(0,Math.min(h,baseB[1]+vBy*bestLam))];
      out.push(synQ);
      out.push(refineQuadByEdges(synQ,feat,7));
    }
  }
  return out;
}

function directA4A3EdgeQuads(feat){
  const{w,h,mag,gx,gy}=feat;
  const hist=new Float32Array(90);
  for(let y=8;y<h-8;y+=2){
    for(let x=8;x<w-8;x+=2){
      const i=y*w+x,m=mag[i];if(m<8)continue;
      let deg=Math.round((Math.atan2(-gx[i],gy[i])*180/Math.PI)%90);
      if(deg<0)deg+=90;
      hist[deg]+=m;
    }
  }
  let bestDeg=0,bestW=-1;
  for(let d=0;d<90;d++)if(hist[d]>bestW){bestW=hist[d];bestDeg=d}
  const th=(bestDeg>45?bestDeg-90:bestDeg)*Math.PI/180;
  const ux=Math.cos(th),uy=Math.sin(th),vx=-uy,vy=ux;
  const cx=w*0.5,cy=h*0.5;
  const maxU=Math.round(Math.hypot(w,h)*0.5),profU=new Float32Array(maxU*2+1),profV=new Float32Array(maxU*2+1);
  for(let y=4;y<h-4;y++){
    for(let x=4;x<w-4;x++){
      const i=y*w+x,m=mag[i];if(m<5)continue;
      const dx=x-cx,dy=y-cy;
      const u=Math.round(dx*ux+dy*uy),v=Math.round(dx*vx+dy*vy);
      const gu=Math.abs(gx[i]*ux+gy[i]*uy),gv=Math.abs(gx[i]*vx+gy[i]*vy);
      if(gu>gv*1.2&&Math.abs(u)<maxU)profU[u+maxU]+=m;
      if(gv>gu*1.2&&Math.abs(v)<maxU)profV[v+maxU]+=m;
    }
  }
  const topPeaks=(arr,sign)=>{
    const pk=[];
    for(let k=Math.round(maxU*0.18);k<maxU-2;k++){
      const idx=maxU+sign*k,v=arr[idx];
      if(v>arr[idx-1]&&v>=arr[idx+1]&&v>40)pk.push({d:sign*k,v});
    }
    pk.sort((a,b)=>b.v-a.v);
    return pk.slice(0,3).map(p=>p.d);
  };
  const Lpeaks=topPeaks(profU,-1),Rpeaks=topPeaks(profU,1),Tpeaks=topPeaks(profV,-1),Bpeaks=topPeaks(profV,1);
  const quads=[];
  for(const uL of Lpeaks)for(const uR of Rpeaks)for(const vT of Tpeaks)for(const vB of Bpeaks){
    const W=uR-uL,H=vB-vT,r=Math.max(W,H)/Math.max(1,Math.min(W,H));
    if(Math.abs(r-ISO_RATIO)/ISO_RATIO<0.18){
      const pt=(u,v)=>[cx+u*ux+v*vx,cy+u*uy+v*vy];
      const q=[pt(uL,vT),pt(uR,vT),pt(uR,vB),pt(uL,vB)];
      quads.push(refineQuadByEdges(q,feat,10));
    }
  }
  return quads;
}

function detectDocQuad(c){
  const MAXD=380,sc=MAXD/Math.max(c.width,c.height);
  const sw=Math.max(48,Math.round(c.width*sc)),sh=Math.max(48,Math.round(c.height*sc));
  const s=mk(sw,sh),sx=s.getContext('2d');sx.drawImage(c,0,0,sw,sh);
  const px=sx.getImageData(0,0,sw,sh).data,N=sw*sh;

  const L=new Float32Array(N),Cr=new Float32Array(N),Cb=new Float32Array(N);
  for(let i=0;i<N;i++){
    const r=px[i*4],g=px[i*4+1],b=px[i*4+2];
    L[i]=(r*77+g*150+b*29)/256;
    Cr[i]=r-g;
    Cb[i]=b-(r+g)*0.5;
  }

  const sharpL=blur(L,sw,sh,1),smCr=blur(Cr,sw,sh,1),smCb=blur(Cb,sw,sh,1);
  const closeRad=Math.max(3,Math.round(Math.min(sw,sh)/68));
  const closedL=blur(morphClose(L,sw,sh,closeRad),sw,sh,1);
  const illum=blur(closedL,sw,sh,Math.round(Math.min(sw,sh)*0.16));
  const flatL=new Float32Array(N);
  for(let i=0;i<N;i++)flatL[i]=Math.min(255,closedL[i]*0.55+(closedL[i]/Math.max(55,illum[i]))*205*0.45);

  const cVals=[];
  let pCr=0,pCb=0,pCnt=0;
  for(let y=Math.round(sh*0.25);y<Math.round(sh*0.75);y+=2){
    for(let x=Math.round(sw*0.25);x<Math.round(sw*0.75);x+=2)cVals.push(flatL[y*sw+x]);
  }
  cVals.sort((a,b)=>a-b);
  const paperL=cVals[Math.floor(cVals.length*0.78)]||200;
  for(let y=Math.round(sh*0.25);y<Math.round(sh*0.75);y+=2){
    for(let x=Math.round(sw*0.25);x<Math.round(sw*0.75);x+=2){
      const i=y*sw+x;if(flatL[i]>=paperL-15){pCr+=smCr[i];pCb+=smCb[i];pCnt++}
    }
  }
  if(pCnt>0){pCr/=pCnt;pCb/=pCnt}

  const mag=new Float32Array(N),gx=new Float32Array(N),gy=new Float32Array(N);
  for(let y=1;y<sh-1;y++){
    for(let x=1;x<sw-1;x++){
      const i=y*sw+x;
      const sxL=(sharpL[i-sw+1]+2*sharpL[i+1]+sharpL[i+sw+1])-(sharpL[i-sw-1]+2*sharpL[i-1]+sharpL[i+sw-1]);
      const syL=(sharpL[i+sw-1]+2*sharpL[i+sw]+sharpL[i+sw+1])-(sharpL[i-sw-1]+2*sharpL[i-sw]+sharpL[i-sw+1]);
      const sxC=((smCr[i-sw+1]+2*smCr[i+1]+smCr[i+sw+1])-(smCr[i-sw-1]+2*smCr[i-1]+smCr[i+sw-1]))*0.7;
      const syC=((smCr[i+sw-1]+2*smCr[i+sw]+smCr[i+sw+1])-(smCr[i-sw-1]+2*smCr[i-sw]+smCr[i-sw+1]))*0.7;
      const sxB=((smCb[i-sw+1]+2*smCb[i+1]+smCb[i+sw+1])-(smCb[i-sw-1]+2*smCb[i-1]+smCb[i+sw-1]))*0.7;
      const syB=((smCb[i+sw-1]+2*smCb[i+sw]+smCb[i+sw+1])-(smCb[i-sw-1]+2*smCb[i-sw]+smCb[i-sw+1]))*0.7;
      const mL=Math.hypot(sxL,syL),mC=Math.hypot(sxC,syC),mB=Math.hypot(sxB,syB);
      if(mL>=mC&&mL>=mB){mag[i]=mL*0.25;gx[i]=sxL*0.25;gy[i]=syL*0.25}
      else if(mC>=mB){mag[i]=mC*0.25;gx[i]=sxC*0.25;gy[i]=syC*0.25}
      else{mag[i]=mB*0.25;gx[i]=sxB*0.25;gy[i]=syB*0.25}
    }
  }

  const feat={w:sw,h:sh,mag,gx,gy,closedL,flatL,paperL};
  const masks=[];
  const tOtsu1=otsu(closedL),tOtsu2=otsu(flatL);
  const m1=new Uint8Array(N),m2=new Uint8Array(N),m3=new Uint8Array(N),m4=new Uint8Array(N);
  for(let i=0;i<N;i++){
    m1[i]=closedL[i]>tOtsu1?1:0;
    m2[i]=flatL[i]>tOtsu2?1:0;
    m3[i]=flatL[i]>Math.max(tOtsu2-12,paperL-28)?1:0;
    const cDist=Math.hypot(smCr[i]-pCr,smCb[i]-pCb);
    m4[i]=(flatL[i]>paperL-24&&cDist<26)?1:0;
  }
  masks.push(m1,m2,m3,m4);

  let bgL=0,bgCr=0,bgCb=0,bgCnt=0;
  for(let y=0;y<sh;y++)for(let x=0;x<sw;x++){
    if(x<3||x>=sw-3||y<3||y>=sh-3){const i=y*sw+x;bgL+=closedL[i];bgCr+=smCr[i];bgCb+=smCb[i];bgCnt++}
  }
  bgL/=bgCnt;bgCr/=bgCnt;bgCb/=bgCnt;
  const distMap=new Float32Array(N);
  for(let i=0;i<N;i++)distMap[i]=Math.min(255,Math.max(0,closedL[i]-bgL)*1.25+Math.hypot(smCr[i]-bgCr,smCb[i]-bgCb)*0.9);
  const t5=otsu(distMap),m5=new Uint8Array(N);
  for(let i=0;i<N;i++)m5[i]=distMap[i]>Math.max(15,t5)?1:0;
  masks.push(m5);

  const rawQuads=[];
  for(const rawM of masks){
    const{mask,area}=cleanMask(rawM,sw,sh);
    if(area<N*0.10||area>N*0.98)continue;
    const bnd=[];
    for(let y=0;y<sh;y++){
      const row=y*sw;
      for(let x=0;x<sw;x++){
        const i=row+x;if(!mask[i])continue;
        if(x===0||x===sw-1||y===0||y===sh-1||!mask[i-1]||!mask[i+1]||!mask[i-sw]||!mask[i+sw])bnd.push([x,y]);
      }
    }
    if(bnd.length<30)continue;
    const H=convexHull(bnd);
    for(const q0 of hullToQuads(H)){
      rawQuads.push(q0);
      rawQuads.push(refineQuadByEdges(q0,feat,9));
    }
  }

  for(const dq of directA4A3EdgeQuads(feat))rawQuads.push(dq);

  rawQuads.sort((a,b)=>scoreA4A3Quad(b,feat)-scoreA4A3Quad(a,feat));
  const topSeeds=rawQuads.slice(0,4);
  const allCandidates=rawQuads.slice(0,12);
  for(const seed of topSeeds){
    for(const synQ of synthesizeA4A3Candidates(seed,feat))allCandidates.push(synQ);
  }

  let bestQ=null,bestScore=-1e9;
  for(const q of allCandidates){
    const s=scoreA4A3Quad(q,feat);
    if(s>bestScore){bestScore=s;bestQ=q}
  }

  if(!bestQ||bestScore<30)return null;
  return bestQ.map(p=>[
    Math.max(0,Math.min(c.width,p[0]/sc)),
    Math.max(0,Math.min(c.height,p[1]/sc))
  ]);
}

// ---- 4. BIẾN ĐỔI PHỐI CẢNH & TỰ ĐỘNG XOAY CHUẨN KHỔ DỌC A4/A3 (1 : √2)
function warp(c,Q){
  let cx=0,cy=0;for(const p of Q){cx+=p[0];cy+=p[1]}cx/=4;cy/=4;
  const Qs=Q.map(p=>[p[0]+(cx-p[0])*0.007,p[1]+(cy-p[1])*0.007]);

  const wTop=dist(Qs[0],Qs[1]),wBot=dist(Qs[3],Qs[2]);
  const hLeft=dist(Qs[0],Qs[3]),hRight=dist(Qs[1],Qs[2]);
  const wMax=Math.max(wTop,wBot),hMax=Math.max(hLeft,hRight);
  const{portrait}=calc3DAspectRatio(Qs,c.width,c.height);

  let W,H;
  if(portrait){
    H=Math.round(Math.max(hMax,wMax*ISO_RATIO));
    W=Math.round(H/ISO_RATIO);
  }else{
    W=Math.round(Math.max(wMax,hMax*ISO_RATIO));
    H=Math.round(W/ISO_RATIO);
  }
  W=Math.max(10,W);H=Math.max(10,H);

  const D=[[0,0],[W-1,0],[W-1,H-1],[0,H-1]],A=[];
  for(let i=0;i<4;i++){const[x,y]=D[i],[X,Y]=Qs[i];A.push([x,y,1,0,0,0,-x*X,-y*X,X]);A.push([0,0,0,x,y,1,-x*Y,-y*Y,Y])}
  for(let i=0;i<8;i++){
    let p=i;for(let r=i+1;r<8;r++)if(Math.abs(A[r][i])>Math.abs(A[p][i]))p=r;
    [A[i],A[p]]=[A[p],A[i]];
    const piv=A[i][i]||1e-12;
    for(let r=0;r<8;r++)if(r!==i){const f=A[r][i]/piv;for(let k=i;k<9;k++)A[r][k]-=f*A[i][k]}
  }
  const k=A.map((r,i)=>r[8]/(r[i]||1e-12)),sw=c.width,sh=c.height,sd=c.getContext('2d').getImageData(0,0,sw,sh).data;
  const o=mk(W,H),oc=o.getContext('2d'),od=oc.createImageData(W,H),dd=od.data;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const w=k[6]*x+k[7]*y+1,X=(k[0]*x+k[1]*y+k[2])/w,Y=(k[3]*x+k[4]*y+k[5])/w,x0=Math.floor(X),y0=Math.floor(Y),i=(y*W+x)*4;
    dd[i+3]=255;if(x0<0||y0<0||x0>=sw-1||y0>=sh-1){dd[i]=dd[i+1]=dd[i+2]=255;continue}
    const fx=X-x0,fy=Y-y0,p=(y0*sw+x0)*4,q=p+sw*4;
    for(let ch=0;ch<3;ch++)dd[i+ch]=sd[p+ch]*(1-fx)*(1-fy)+sd[p+4+ch]*fx*(1-fy)+sd[q+ch]*(1-fx)*fy+sd[q+4+ch]*fx*fy;
  }
  oc.putImageData(od,0,0);
  // Tự động dựng dọc trang giấy nếu cảm biến điện thoại lưu ảnh nằm ngang
  return o.width>o.height?rot90(o):o;
}

function enhance(c,mode){
  const w=c.width,h=c.height,ctx=c.getContext('2d'),im=ctx.getImageData(0,0,w,h),d=im.data,f=8,sw=Math.ceil(w/f),sh=Math.ceil(h/f),sm=new Float32Array(sw*sh),cn=new Float32Array(sw*sh);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4,j=(y/f|0)*sw+(x/f|0);sm[j]+=(d[i]*77+d[i+1]*150+d[i+2]*29)/256;cn[j]++}
  for(let j=0;j<sm.length;j++)sm[j]/=cn[j]||1;
  const s=Math.min(w,h),bg=blur(sm,sw,sh,mode==='bw'?Math.max(2,Math.round(s/80*2/f)):Math.max(3,Math.round(s/10/f)));
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=(y*w+x)*4,b=bg[(y/f|0)*sw+(x/f|0)];
    if(mode==='bw'){
      const l=(d[i]*77+d[i+1]*150+d[i+2]*29)/256,v=l>b-11?255:0;
      d[i]=d[i+1]=d[i+2]=v;
    }else{
      const g=255/Math.max(b,45),r0=d[i],g0=d[i+1],b0=d[i+2];
      const isRedStamp=(r0-g0>26&&r0-b0>18);
      for(let ch=0;ch<3;ch++){
        let v=(d[i+ch]*g-128)*(isRedStamp?1.18:1.28)+134;
        d[i+ch]=v<0?0:v>255?255:v;
      }
    }
  }
  ctx.putImageData(im,0,0);
}

// ---- 5. NẠP ẢNH AN TOÀN TRÊN DI ĐỘNG & CAMERA TRỰC TIẾP TRONG KHUNG DỌC
function stopLiveCam(){
  if(liveStream){liveStream.getTracks().forEach(t=>t.stop());liveStream=null}
  $('#liveVid').hidden=true;
  $('#liveBtn').textContent='🎥 Cam';
  $('#liveBtn').className='';
}

const setHint=t=>{
  stopLiveCam();
  $('#hint').innerHTML=t;$('#hint').hidden=false;
  $('#pv').hidden=true;$('#badge').hidden=true;$('#loupe').hidden=true;$('#a4guide').hidden=false;
  $('#box').classList.remove('editing');
};

function defaultA4Quad(c){
  const w=c.width,h=c.height,land=w>h;
  let qw=w*0.86,qh=land?qw/ISO_RATIO:qw*ISO_RATIO;
  if(qh>h*0.86){qh=h*0.86;qw=land?qh*ISO_RATIO:qh/ISO_RATIO}
  const x0=(w-qw)*0.5,y0=(h-qh)*0.5;
  return[[x0,y0],[x0+qw,y0],[x0+qw,y0+qh],[x0,y0+qh]];
}

// Nạp file ảnh an toàn bằng onload (không dùng img.decode() gây lỗi trên ảnh dọc HEIC/JPEG 48MP của iOS/Android)
function readImageElement(file){
  return new Promise((ok,no)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{URL.revokeObjectURL(url);ok(img)};
    img.onerror=()=>{
      URL.revokeObjectURL(url);
      const fr=new FileReader();
      fr.onload=()=>{const i2=new Image();i2.onload=()=>ok(i2);i2.onerror=no;i2.src=fr.result};
      fr.onerror=no;
      fr.readAsDataURL(file);
    };
    img.src=url;
  });
}

async function processRawCanvas(c){
  stopLiveCam();
  // Nếu ảnh chụp từ camera bị xoay ngang (width > height), tự động dựng dọc về chuẩn giao diện dọc
  raw=c.width>c.height?rot90(c):c;
  rot=0;editingQuad=false;
  setHint('Đang nhận diện mép giấy A4/A3 dọc…');
  await new Promise(r=>setTimeout(r,25));
  const q=detectDocQuad(raw);
  if(q){curQuad=q;isAutoQuad=true}else{curQuad=defaultA4Quad(raw);isAutoQuad=false}
  render();
}

async function loadFile(f){
  if(!f)return;
  try{
    setHint('Đang đọc ảnh từ máy…');
    const img=await readImageElement(f);
    const w0=img.naturalWidth||img.width,h0=img.naturalHeight||img.height;
    const k=Math.min(1,MAXL/Math.max(w0,h0));
    const c=mk(Math.max(1,Math.round(w0*k)),Math.max(1,Math.round(h0*k)));
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    await processRawCanvas(c);
  }catch(e){
    toast('Không đọc được ảnh: '+e.message);
  }
}

// Chế độ mở Camera trực tiếp ngay trong khung dọc A4 (nếu người dùng bấm [🎥 Cam])
$('#liveBtn').onclick=async()=>{

function drawQuadEditor(focusPt){
  if(!raw||!curQuad)return;
  const p=$('#pv');p.width=raw.width;p.height=raw.height;
  const ctx=p.getContext('2d');
  ctx.drawImage(raw,0,0);
  ctx.fillStyle='rgba(0,0,0,0.45)';
  ctx.beginPath();ctx.rect(0,0,p.width,p.height);
  ctx.moveTo(curQuad[0][0],curQuad[0][1]);
  for(let i=3;i>=0;i--)ctx.lineTo(curQuad[i][0],curQuad[i][1]);
  ctx.closePath();ctx.fill();

  const lw=Math.max(3,Math.round(Math.max(p.width,p.height)/240));
  ctx.strokeStyle='#00e676';ctx.lineWidth=lw;
  ctx.beginPath();
  curQuad.forEach((pt,i)=>i?ctx.lineTo(pt[0],pt[1]):ctx.moveTo(pt[0],pt[1]));
  ctx.closePath();ctx.stroke();

  const rad=Math.max(16,Math.round(Math.max(p.width,p.height)/50));
  curQuad.forEach(pt=>{
    ctx.beginPath();ctx.arc(pt[0],pt[1],rad,0,Math.PI*2);
    ctx.fillStyle='rgba(0,230,118,0.28)';ctx.fill();
    ctx.lineWidth=lw;ctx.strokeStyle='#fff';ctx.stroke();
    ctx.beginPath();ctx.arc(pt[0],pt[1],Math.max(4,rad*0.25),0,Math.PI*2);
    ctx.fillStyle='#00e676';ctx.fill();
  });

  const lp=$('#loupe');
  if(focusPt){
    lp.hidden=false;
    const lctx=lp.getContext('2d'),zoom=2.3,sz=96,half=sz/(2*zoom);
    lctx.fillStyle='#111';lctx.fillRect(0,0,sz,sz);
    lctx.drawImage(raw,focusPt[0]-half,focusPt[1]-half,half*2,half*2,0,0,sz,sz);
    lctx.strokeStyle='#00e676';lctx.lineWidth=2;
    lctx.beginPath();lctx.moveTo(sz/2-14,sz/2);lctx.lineTo(sz/2+14,sz/2);
    lctx.moveTo(sz/2,sz/2-14);lctx.lineTo(sz/2,sz/2+14);lctx.stroke();
  }else lp.hidden=true;
}

async function render(){
  if(!raw)return;
  $('#a4guide').hidden=true;
  if(editingQuad){
    $('#box').classList.add('editing');
    $('#pv').hidden=false;$('#hint').hidden=true;
    $('#editQ').textContent='✓ Xong';$('#editQ').className='warn';
    $('#badge').textContent='Kéo 4 chấm tròn vào 4 góc tờ giấy dọc';$('#badge').hidden=false;
    drawQuadEditor(null);return;
  }
  $('#box').classList.remove('editing');
  $('#editQ').textContent='📐 Góc';$('#editQ').className='';$('#loupe').hidden=true;
  setHint('Đang nắn phẳng chuẩn khổ dọc A4/A3…');await new Promise(r=>setTimeout(r,20));
  try{
    let c=($('#crop').checked&&curQuad&&(isAutoQuad||curQuad.manual))?warp(raw,curQuad):copy(raw);
    for(let i=0;i<rot;i++)c=rot90(c);
    enhance(c,$('#mode').value);proc=c;
    const p=$('#pv');p.width=c.width;p.height=c.height;p.getContext('2d').drawImage(c,0,0);
    p.hidden=false;$('#hint').hidden=true;$('#a4guide').hidden=true;
    const b=$('#badge');
    if($('#crop').checked){
      b.textContent=curQuad?.manual?'✓ Đã cắt chuẩn A4/A3 dọc (Chỉnh tay)':(isAutoQuad?'✓ Đã tự động cắt chuẩn A4/A3 dọc (1 : √2)':'⚠ Chưa rõ mép (Bấm [📐 Góc] để chỉnh)');
      b.hidden=false;
    }else b.hidden=true;
    $('#save').disabled=$('#rot').disabled=$('#editQ').disabled=false;
    $('#againLbl').style.opacity='1';$('#againLbl').style.pointerEvents='auto';
    $('#save').textContent=retake!=null?`✓ CẬP NHẬT TRANG ${retake+1}`:'✓ LƯU TRANG';
  }catch(e){toast('Lỗi xử lý ảnh: '+e.message)}
}

function canvasCoords(e){
  const p=$('#pv'),r=p.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left;
  const cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top;
  return[Math.max(0,Math.min(p.width,cx*p.width/r.width)),Math.max(0,Math.min(p.height,cy*p.height/r.height))];
}
const pCanvas=$('#pv');
pCanvas.addEventListener('pointerdown',e=>{
  if(!editingQuad||!curQuad)return;
  pCanvas.setPointerCapture(e.pointerId);
  const pt=canvasCoords(e);
  let bestI=-1,bestD=1e9;
  curQuad.forEach((q,i)=>{const d=dist(pt,q);if(d<bestD){bestD=d;bestI=i}});
  if(bestD<Math.max(raw.width,raw.height)*0.18){dragIdx=bestI;curQuad[dragIdx]=pt;curQuad.manual=true;drawQuadEditor(pt)}
});
pCanvas.addEventListener('pointermove',e=>{
  if(!editingQuad||dragIdx<0)return;
  const pt=canvasCoords(e);
  const r=pCanvas.getBoundingClientRect(),lx=e.clientX-r.left;
  $('#loupe').style.left=lx<r.width*0.45?'auto':'8px';
  $('#loupe').style.right=lx<r.width*0.45?'8px':'auto';
  curQuad[dragIdx]=pt;curQuad.manual=true;drawQuadEditor(pt);
});
pCanvas.addEventListener('pointerup',()=>{if(dragIdx>=0){dragIdx=-1;curQuad=orderQuad(curQuad);curQuad.manual=true;drawQuadEditor(null)}});

$('#editQ').onclick=()=>{

const clean=v=>v.trim().replace(/[<>:"/\\|?*]/g,''),fname=()=>`CHUACOGIAY_${clean($('#f_ma').value)||'[MÃ HỒ SƠ]'}_${clean($('#f_to').value)||'[SỐ TỜ]'}_${clean($('#f_thua').value)||'[SỐ THỬA]'}.pdf`;

const dims=b=>new Promise((ok,no)=>{const i=new Image(),u=URL.createObjectURL(b);i.onload=()=>{URL.revokeObjectURL(u);ok([i.naturalWidth,i.naturalHeight])};i.onerror=no;i.src=u});

async function buildPdf(blobs,paperType){
  const enc=new TextEncoder(),parts=[],off=[];let pos=0;
  const isA3=paperType==='A3';
  const SHORT_PT=isA3?841.89:595.28,LONG_PT=isA3?1190.55:841.89;
  const put=u=>{if(typeof u==='string')u=enc.encode(u);parts.push(u);pos+=u.length},begin=n=>{off[n]=pos;put(`${n} 0 obj\n`)};
  put('%PDF-1.4\n');begin(1);put('<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  begin(2);put(`<< /Type /Pages /Kids [${blobs.map((_,i)=>`${3+i*3} 0 R`).join(' ')}] /Count ${blobs.length} >>\nendobj\n`);
  for(let i=0;i<blobs.length;i++){
    const[w,h]=await dims(blobs[i]),by=new Uint8Array(await blobs[i].arrayBuffer()),land=w>h,PW=land?LONG_PT:SHORT_PT,PH=land?SHORT_PT:LONG_PT,mg=10,
      sc=Math.min((PW-2*mg)/w,(PH-2*mg)/h),dw=w*sc,dh=h*sc,x=(PW-dw)/2,y=(PH-dh)/2,pg=3+i*3,ct=pg+1,im=pg+2,cs=`q ${dw.toFixed(2)} 0 0 ${dh.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)} cm /Im0 Do Q`;
    begin(pg);put(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 ${im} 0 R >> >> /Contents ${ct} 0 R >>\nendobj\n`);
    begin(ct);put(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream\nendobj\n`);
    begin(im);put(`<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${by.length} >>\nstream\n`);put(by);put('\nendstream\nendobj\n');
  }
  const N=3+blobs.length*3,xr=pos;put(`xref\n0 ${N}\n0000000000 65535 f \n`);for(let n=1;n<N;n++)put(String(off[n]).padStart(10,'0')+' 00000 n \n');
  put(`trailer\n<< /Size ${N} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`);return new Blob(parts,{type:'application/pdf'});
}

$('#go').onclick=async()=>{
  const ma=clean($('#f_ma').value),to=clean($('#f_to').value),th=clean($('#f_thua').value);
  if(!ma||!to||!th)return toast('Vui lòng nhập đầy đủ Mã hồ sơ, Số tờ và Số thửa!');
  S.ma=ma;S.to=to;S.thua=th;save();$('#go').disabled=true;$('#go').textContent='Đang tạo PDF…';
  try{
    pdf={blob:await buildPdf(S.pages,$('#f_paper').value),name:fname()};$('#res').hidden=false;
    $('#share').hidden=!(navigator.canShare&&navigator.canShare({files:[new File([pdf.blob],pdf.name,{type:'application/pdf'})]}));
    toast('Xuất PDF thành công!');
  }catch(e){toast('Xuất PDF thất bại: '+e.message)}
  $('#go').disabled=false;$('#go').textContent='XUẤT FILE PDF';
};
$('#share').onclick=()=>navigator.share({files:[new File([pdf.blob],pdf.name,{type:'application/pdf'})],title:pdf.name}).catch(()=>{});
$('#dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(pdf.blob);a.download=pdf.name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)};
(async()=>{try{const v=await kv('readonly',s=>s.get('s'));if(v)S=v}catch(e){}gallery()})();
</script></body></html>
